{% extends 'admin/base.html' %}

{% block content %}

<h3 style="background-color: rgb(198, 197, 197);">
    Editar Produtos</h3>

<div class="container">

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="nome_produto">Nome do produto:</label>
            <input type="text" class="form-control" id="nome_produto" value="{{produto.nome}}" name="nome_produto">
                </div>

            <div class="form-group">
                <label for="descricao">preco:</label>
                <input type="text" class="form-control" value="{{produto.preco}}" id="preco" name="preco"
                    required>
            </div>

            <div class=" form-group">
                <label for="ativo" id="ativo" class="form-label">
                    Status</label>
                <select class="form-select" name="ativo">
                    <option value="True" {% if produto.ativo=='True' %}selected{% endif %}>Ativo</option>

                    <option value="False" {% if produto.ativo=='False' %}selected{% endif %}>Inativo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imagem_atual">Imagem Atual:</label>
                <img src="data:image/jpeg;base64,
            {{ produto['imagem'] }}" alt="Imagem Atual" style="width: 200px;">
            </div>

            <div class="form-group">
                <label for="imagem">Nova imagem:</label>
                <input type="file" class="form-control" id="imagem" name="imagem">

            </div>

            <br>

            <button type="submit" class="btn btn-primary mb-2">
                Cadastrar</button>
    </form>
</div>

{% endblock %}
